name: Unit tests

on:
  push:
    branches:
      - "**"
    paths-ignore: &documentation-only
      - "**/*.md"
      - "**/*.avif"
      - "**/*.bmp"
      - "**/*.gif"
      - "**/*.ico"
      - "**/*.jpeg"
      - "**/*.jpg"
      - "**/*.png"
      - "**/*.svg"
      - "**/*.tif"
      - "**/*.tiff"
      - "**/*.webp"
  pull_request:
    branches:
      - master
    paths-ignore: *documentation-only

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    # Approval gate configuration:
    # Pushes to the master branch automatically target the 'production' environment.
    # Pushes to any other branch dynamically target the 'approval-gate' environment,
    # which requires manual review and approval in GitHub repository settings before execution.
    environment:
      name: ${{ github.ref_name == 'master' && 'production' || 'approval-gate' }}
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release

    steps:
      - uses: actions/checkout@v7

      - uses: microsoft/setup-msbuild@v3

      - name: Restore
        run: msbuild src/ObjectListView2022.Tests/ObjectListView2022.Tests.csproj /t:Restore

      - name: Build
        run: msbuild src/ObjectListView2022.Tests/ObjectListView2022.Tests.csproj /t:Build /p:Configuration=${{ matrix.configuration }} /p:RestorePackages=false

      - name: Test
        run: dotnet test src/ObjectListView2022.Tests/ObjectListView2022.Tests.csproj --configuration ${{ matrix.configuration }} --no-build --no-restore --logger "console;verbosity=normal"
